[workspace]
members = ["ext4fs-core", "ext4fs-fuse", "ext4fs-cli"]
resolver = "2"

# Single source of truth for fields shared by every member (DRY): bump version /
# MSRV / license here once; members inherit via `field.workspace = true`.
[workspace.package]
version = "0.2.5"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

# Single source of truth for dependency versions (DRY): declare each once;
# members write `dep.workspace = true`. The inter-crate `ext4fs` version lives
# here too, so a bump touches one line instead of every dependent.
[workspace.dependencies]
ext4fs = { package = "ext4fs-core", path = "ext4fs-core", version = "0.2.5" }
forensicnomicon = "1"
bitflags = "2"
# Lean library core (hash primitives only) — NOT the full blazehash app, whose
# opendal/cloud stack drags in a large, license-tainted transitive tree. The
# import path stays `blazehash::algorithm` via the package rename (fleet rule:
# "ext4fs-core depends on blazehash-core for algorithm::hash_bytes").
blazehash = { package = "blazehash-core", version = "0.2" }
crc = "3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ewf = "0.2"
forensic-mount = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
# binary parser patterns: field names mirror on-disk spec (ib_hi, it_hi, etc.)
similar_names = { level = "allow", priority = 1 }
# forensic recovery uses float comparisons for scoring thresholds
float_cmp = { level = "allow", priority = 1 }
# helper closures defined inside functions are idiomatic in parsers
items_after_statements = { level = "allow", priority = 1 }
# complex parsing functions legitimately exceed line limits
too_many_lines = { level = "allow", priority = 1 }
# `if let Some(x) = .. { x } else { skip }` skip-guards read clearly in
# optional-fixture tests (fleet standard: ewf, vmdk-forensic, ntfs-forensic)
manual_let_else = { level = "allow", priority = 1 }
# doc comments intentionally use plain text for field names
doc_markdown = { level = "allow", priority = 1 }
# u64 as f64 used for forensic scoring ratios, precision loss is acceptable
cast_precision_loss = { level = "allow", priority = 1 }

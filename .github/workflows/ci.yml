name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@f9802dca64a95eb881fd05dd3f4f16e53b97f2b3
    with:
      # ext4fs-fuse links `fuser` -> libfuse3, so every compiling job needs
      # these. The old ci.yml installed them by hand as the first step of
      # clippy, test, coverage, msrv and geiger; without them the failure
      # surfaces in the LINKER ("failed to run custom build command"), not in
      # cargo, so dropping them would look nothing like a missing input.
      system-packages: libfuse3-dev pkg-config
      # The old test job was `runs-on: ubuntu-latest` with NO matrix — one
      # platform, by decision, because of the libfuse3 dependency. Inheriting
      # the default (ubuntu + macos + windows) would ADD two platforms this
      # repo has never been green on.
      os-matrix: false
      # The old MSRV job ran `cargo test --workspace --all-features` at 1.88,
      # not a bare build.
      msrv-check: test
      # The old coverage gate is NOT the fleet gate and the shared workflow
      # cannot express it: it enforced 100% lines on exactly ONE file,
      # `*/ext4fs-core/src/vfs.rs`, and deliberately ignored every other file
      # ("Other modules carry pre-existing coverage debt tracked separately").
      # `coverage-scope` offers workspace|lib — there is no per-file scope — so
      # switching to the shared gate would turn a single-file gate into a
      # whole-workspace one and light up the known debt. The job is carried
      # below verbatim instead; adopting the shared gate is a coverage
      # decision, not a config move.
      coverage-gate: "off"

  # -- carried across verbatim from the previous ci.yml ---------------------
  coverage:
    name: Coverage (forensic-vfs adapter, 100% lines)
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y libfuse3-dev pkg-config
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: cargo-llvm-cov
      # Measure WITH --all-features so the `vfs` adapter (behind the `vfs`
      # feature) and its integration tests are actually covered — a bare
      # `--lib` run would report the adapter as 0% and never gate it.
      - name: Generate lcov (all features)
        run: cargo llvm-cov -p ext4fs-core --all-features --lcov --output-path lcov.info
      # The forensic-vfs adapter (src/vfs.rs) is the interface published for the
      # engine to compose an ext4 volume; every one of its lines must be
      # exercised. Other modules carry pre-existing coverage debt tracked
      # separately; this gate holds the adapter at 100%. A `// cov:unreachable`
      # marker exempts a provably-dead defensive guard (kept for panic-freedom).
      - name: Enforce 100% lines on the vfs adapter
        shell: bash
        run: |
          fail=0
          gate=0
          while IFS= read -r line; do
            if [[ "$line" == SF:* ]]; then
              f="${line#SF:}"
              case "$f" in
                */ext4fs-core/src/vfs.rs) gate=1 ;;
                *) gate=0 ;;
              esac
            elif [[ "$gate" -eq 1 && "$line" =~ ^DA:([0-9]+),0$ ]]; then
              n="${BASH_REMATCH[1]}"
              src="$(sed -n "${n}p" "$f")"
              if [[ "$src" == *cov:unreachable* ]]; then
                echo "exempt (// cov:unreachable): $f:$n"
              else
                echo "::error::Uncovered adapter line $f:$n:$src"
                fail=1
              fi
            fi
          done < lcov.info
          if [[ "$fail" -ne 0 ]]; then exit 1; fi
          echo "forensic-vfs adapter fully line-covered (or annotated // cov:unreachable)."

  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: sudo apt-get install -y libfuse3-dev pkg-config
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true

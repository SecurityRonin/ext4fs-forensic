[package]
name = "ext4fs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Forensic-grade ext4 filesystem parser"
license.workspace = true

# Bare `ext4fs` is taken on crates.io (yybit). Publish as ext4fs-core but keep
# the import path `use ext4fs` via the fleet co-existence pattern (cf. vmdk-core).
[lib]
name = "ext4fs"
path = "src/lib.rs"

[features]
default = ["hashing"]
ewf = ["dep:ewf"]
hashing = ["dep:blazehash"]
# Adapt `Ext4Fs` to the forensic-vfs `FileSystem` trait (see `src/vfs.rs`) so an
# ext4 volume composes as `Arc<dyn FileSystem>` in the forensic-vfs engine.
vfs = ["dep:forensic-vfs"]

[dependencies]
# The fleet's single audited bounds-checked integer reader (no_std,
# forbid(unsafe), fuzzed): reads return 0 out of range, never panic. Replaces
# hand-rolled from_{le,be}_bytes(..).try_into().unwrap() slice reads.
safe-read = "0.1"
bitflags = { workspace = true }
blazehash = { workspace = true, optional = true }
crc = { workspace = true }
ewf = { workspace = true, optional = true }
forensicnomicon = { workspace = true }
# forensic-vfs (KNOWLEDGE leaf) — the read-only FileSystem navigation contract.
# Optional so a bare reader stays dependency-light; the `vfs` feature turns on
# the `impl FileSystem for Ext4Fs` adapter.
forensic-vfs = { version = "0.7", optional = true }

[lints]
workspace = true

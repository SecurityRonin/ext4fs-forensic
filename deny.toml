[advisories]
version = 2
ignore = [
    # adler is unmaintained but NOT vulnerable; it reaches us transitively via
    # miniz_oxide/flate2. The maintained successor is adler2, which the graph
    # already migrates to as deps update. No code path of ours is affected.
    "RUSTSEC-2025-0056",
    # --- unmaintained-not-vulnerable (dormant crates, no known defect) ---
    # bincode 1.3.3: the team declared 1.3.3 a complete version needing no updates;
    # reaches us via blazehash-core's serialization. No vulnerability.
    "RUSTSEC-2025-0141",
    # fxhash 0.2.1: dormant hasher, no known defect; transitive via blazehash-core.
    "RUSTSEC-2025-0057",
    # number_prefix 0.4.0: dormant; via indicatif's progress bar. No vulnerability.
    "RUSTSEC-2025-0119",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # xxhash-rust (BSL-1.0) is a legitimate forensic hash pulled by blazehash-core;
    # the fleet allows BSL-1.0 rather than amputating the hash capability.
    "BSL-1.0",
    # tiny-keccak (CC0-1.0), a permissive public-domain-equivalent license, also
    # reaches us through blazehash-core.
    "CC0-1.0",
    # option-ext (MPL-2.0), a weak file-level copyleft license, reaches us via the
    # dirs/directories stack that forensic-mount uses for session directories.
    "MPL-2.0",
    # webpki-roots (CDLA-Permissive-2.0), a permissive data license for the CA trust
    # store, reaches us via forensic-mount's rustls/ureq TLS stack.
    "CDLA-Permissive-2.0",
    # libbz2-rs-sys carries upstream libbzip2's BSD-style license verbatim. It arrives
    # as forensic-mount -> sevenz-rust2 -> bzip2 -> libbz2-rs-sys, i.e. 7z
    # decompression. Permissive, not copyleft; 4n6mount allows it for the same path.
    "bzip2-1.0.6",
]

[bans]
# Transitive version splits (bitflags 1/2, twox-hash 1/2, windows-sys 0.52/0.61,
# getrandom 0.3/0.4, ...) are pulled by third-party and sibling deps we do not
# control; warn rather than fail (matches ntfs-forensic). ext4fs-core's own tree
# stays lean via blazehash-core.
multiple-versions = "warn"
wildcards = "allow" # the inter-crate ext4fs path dep carries a version, but keep lenient

[[bans.skip]]
name = "cpufeatures"
reason = "blazehash and sha2 require different versions"

[[bans.skip]]
name = "hashbrown"
reason = "uuid and other deps require different versions"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

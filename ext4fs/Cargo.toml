[package]
name = "ext4fs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Forensic-grade ext4 filesystem parser"
license = "MIT"

[features]
default = ["hashing"]
ewf = ["dep:ewf"]
hashing = ["dep:blazehash"]

[dependencies]
bitflags = "2"
blazehash = { version = "0.2", default-features = false, optional = true }
crc = "3"

[dependencies.ewf]
version = "0.2"
path = "../../ewf/ewf"
optional = true

[lints]
workspace = true
